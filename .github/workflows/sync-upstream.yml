name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'migawari0202-cpu/rikkahub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test sync and conflict queue
        run: node --test .github/scripts/sync-upstream.test.cjs
      - name: Sync or queue conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const sync = require('./.github/scripts/sync-upstream.cjs');
            await sync({ github, context, core });